<title>猪油渣个人工作台</title>
<style>
/* ============ 设计系统：马卡龙低饱和 + 玻璃拟态 ============ */
:root{
  --bg1:#fdf2f8; --bg2:#eef4ff; --bg3:#f0fdf4; --bg4:#fef9f0;
  --surface:rgba(255,255,255,0.62);
  --surface-solid:#ffffff;
  --ink:#5b5470; --ink-soft:#7a7290; --muted:#a59fb5;
  --rule:rgba(150,130,170,0.16);
  --shadow:0 8px 30px rgba(150,120,170,0.14);
  --shadow-sm:0 4px 16px rgba(150,120,170,0.10);
  --radius:26px; --radius-sm:16px; --radius-xs:11px;
  --pink:#f4a6bd; --mint:#9bd4c2; --lav:#c3b3e8; --peach:#f6c89f;
  --sky:#a8c9ee; --lemon:#f0d98e; --rose:#ee9bb0; --sage:#bcd6a8;
  --accent:#e89bb8; --accent2:#9db6e8;
  --ok:#8fcfa0; --warn:#f0b86e; --danger:#ec8fa3;
  --nav-h:64px; --side-w:248px;
  --f:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--f); color:var(--ink); min-height:100vh; line-height:1.6;
  background:
    radial-gradient(circle at 12% 18%, rgba(244,166,189,.30), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(168,201,238,.32), transparent 40%),
    radial-gradient(circle at 80% 88%, rgba(155,212,194,.30), transparent 45%),
    radial-gradient(circle at 18% 82%, rgba(246,200,159,.28), transparent 42%),
    linear-gradient(135deg,#fdf6fb,#f1f7ff 60%,#f3fdf5);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.2px}
p{margin:0} a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
ul{margin:0;padding:0;list-style:none}
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.55);border-radius:var(--radius);box-shadow:var(--shadow)}
.app{display:flex;min-height:100vh}
.side{width:var(--side-w);flex:0 0 var(--side-w);position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:8px;z-index:40;background:rgba(255,255,255,.5);backdrop-filter:blur(20px);border-right:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow-sm)}
.brand b{font-size:17px;color:var(--ink)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.nav::-webkit-scrollbar{width:5px}.nav::-webkit-scrollbar-thumb{background:rgba(150,130,170,.25);border-radius:9px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--ink-soft);font-size:14.5px;font-weight:600;transition:.22s;position:relative}
.nav-item .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.5);transition:.22s}
.nav-item:hover{background:rgba(255,255,255,.65);color:var(--ink);transform:translateX(3px)}
.nav-item:hover .ic{transform:scale(1.08) rotate(-4deg)}
.nav-item.active{background:linear-gradient(135deg,rgba(244,166,189,.32),rgba(157,182,232,.30));color:var(--ink);box-shadow:var(--shadow-sm)}
.nav-item.active .ic{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:5px;height:22px;border-radius:9px;background:linear-gradient(var(--accent),var(--accent2))}
.side-foot{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--rule)}
.side-foot .mini{font-size:12px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.5);color:var(--ink-soft);display:flex;align-items:center;gap:8px;transition:.2s}
.side-foot .mini:hover{background:#fff;color:var(--ink)}
.side-foot .mini.sync-btn{background:linear-gradient(135deg,rgba(244,166,189,.35),rgba(157,182,232,.30));color:var(--ink);font-weight:700}
.side-foot .mini.sync-btn:hover{filter:brightness(1.05)}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;justify-content:space-between}
.topbar h1{font-size:23px}
.topbar .sub{color:var(--muted);font-size:13.5px;font-weight:500}
.topbar-sync{margin-left:auto;flex-shrink:0}
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-3{grid-template-columns:repeat(3,1fr)}
.card{padding:20px 22px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;color:#fff}
.card-h h3{font-size:16.5px}
.card-h .more{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
.card-h .more:hover{color:var(--accent)}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-block}
.pill{font-size:12px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.6);color:var(--ink-soft);font-weight:600;border:1px solid var(--rule)}
.sec-tip{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.5);padding:10px 14px;border-radius:12px;border:1px dashed var(--rule);margin:10px 0;display:flex;gap:8px;align-items:flex-start}
.sec-tip::before{content:"💡"}
.btn{padding:10px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--rule)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);background:#fff}
.btn.primary{background:linear-gradient(135deg,var(--pink),var(--accent2));color:#fff;border:none}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:11px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn-block{width:100%;justify-content:center}
.field{width:100%;padding:11px 14px;border-radius:13px;border:1px solid var(--rule);background:rgba(255,255,255,.7);outline:none;transition:.2s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,155,184,.18);background:#fff}
label.fl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px;display:block}
/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:16px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;padding:4px 0}
.cal-cell{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.4);padding:6px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;transition:.2s;position:relative;min-height:46px;overflow:hidden;cursor:pointer}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell:hover{background:rgba(255,255,255,.8);transform:scale(1.04)}
.cal-cell.today{outline:2px solid var(--accent)}
.cal-cell .dnum{font-weight:700}
.cal-cell .dot{font-size:9px;font-weight:700;line-height:1.3;border-radius:5px;padding:1px 3px;text-align:center;color:#fff}
/* 健身日历 - 训记风格 */
#fitCal .cal-cell{padding:4px;gap:2px;aspect-ratio:auto;min-height:80px}
#fitCal .cal-cell .dnum{font-weight:700;font-size:12px;margin-bottom:1px}
.fit-rec{border-radius:5px;overflow:hidden;font-size:9px;line-height:1.3;display:flex;flex-direction:column}
.fit-rec .dur{background:#9e9e9e;color:#fff;font-weight:600;padding:1px 4px;font-size:8.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fit-rec .name{padding:1px 4px;font-weight:600;color:#333;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fit-rec.strength .name{background:#b8e0c8}
.fit-rec.dance .name{background:#fff0b8}
.fit-rec.sq .name{background:#ffc8c8}
.fit-rec.rest .name{background:#ffb74d;color:#fff}
.fit-rec.core .name{background:#c8b8e8;color:#fff}
.fit-rec.cardio .name{background:#b8d4e8}
.fit-rec.pilates .name{background:#b39ddb;color:#fff}
.fit-rec.other .name{background:#d7ccc8}
.fit-rec-total{background:#888;color:#fff;font-size:8.5px;font-weight:600;padding:1px 4px;border-radius:4px 4px 0 0;text-align:center}
/* 列表项 */
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.5);transition:.2s;margin-bottom:9px;border:1px solid rgba(255,255,255,.5)}
.li:hover{background:#fff;transform:translateX(3px);box-shadow:var(--shadow-sm)}
.li .meta{flex:1;min-width:0}
.li .meta b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta small{font-size:12px;color:var(--muted)}
.li .amt{font-weight:700;font-size:15px}
.li .amt.in{color:var(--ok)}.li .amt.out{color:var(--danger)}
/* 签到入口 - APP 图标风格 */
.portal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 16px}
.portal{padding:0;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.25s;cursor:pointer;color:var(--ink);text-align:center}
.portal:hover{transform:translateY(-4px) scale(1.03);box-shadow:none}
.portal .big-ic{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;font-size:42px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18);position:relative;overflow:hidden}
.portal b{font-size:14px;font-weight:600}
.portal small{font-size:11px;color:var(--muted)}
/* 九号出行 - 深紫黑渐变 + 九号人形logo风格 */
.p-nine .big-ic{background:linear-gradient(145deg,#2a2a4a 0%,#1a1a2e 50%,#0d0d1a 100%)}
.p-nine .big-ic::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f0f0f8 0%,#c8c8e0 60%,#a0a0c0 100%)}
.p-nine .big-ic::after{content:"9";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;font-style:italic;color:#1a1a2e;font-family:system-ui}
/* 飞猪旅行 - 橙红渐变 + 小猪风格 */
.p-fliggy .big-ic{background:linear-gradient(145deg,#ffb347 0%,#ff7b3a 40%,#ff4757 100%)}
.p-fliggy .big-ic::before{content:"";position:absolute;top:20%;left:50%;transform:translateX(-50%);width:44px;height:40px;border-radius:50% 50% 45% 45%;background:#ffdd55;box-shadow:0 4px 0 #ffcc33}
.p-fliggy .big-ic::after{content:"🐷";position:absolute;bottom:12%;left:50%;transform:translateX(-50%);font-size:20px}
/* 比亚迪海洋 - 亮蓝 + 海洋文字 */
.p-byd .big-ic{background:linear-gradient(145deg,#4fc3f7 0%,#29b6f6 40%,#0288d1 100%)}
.p-byd .big-ic::before{content:"海洋";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;color:#fff;letter-spacing:2px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
/* 隐藏portal内的emoji图标（用CSS伪元素替代） */
.p-nine .big-ic, .p-fliggy .big-ic, .p-byd .big-ic{font-size:0}
.check{width:22px;height:22px;border-radius:8px;border:2px solid var(--rule);display:grid;place-items:center;transition:.2s;flex-shrink:0;cursor:pointer}
.check.done{background:linear-gradient(135deg,var(--ok),#6ab189);border-color:transparent}
.check.done::after{content:"✓";color:#fff;font-size:13px;font-weight:800}
/* 卡片网格 */
.item-card{padding:16px;border-radius:18px;background:rgba(255,255,255,.55);transition:.25s;border:1px solid rgba(255,255,255,.5);display:flex;flex-direction:column;gap:8px;cursor:pointer}
.item-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);background:#fff}
.item-card b{font-size:14.5px}
.item-card small{font-size:12px;color:var(--muted)}
.item-card .ic-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
/* 新闻 APP 图标卡片 */
.news-icon-card{padding:18px;border-radius:18px;background:rgba(255,255,255,.55);transition:.25s;border:1px solid rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center}
.news-icon-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);background:#fff}
.news-icon-card .app-logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;color:#fff;box-shadow:var(--shadow-sm)}
.news-icon-card b{font-size:14px}
/* 新闻行：图标+文字+前往按钮 */
.news-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.55);transition:.25s;border:1px solid rgba(255,255,255,.5);cursor:pointer}
.news-row:hover{background:#fff;transform:translateX(3px);box-shadow:var(--shadow-sm)}
/* 自媒体平台图标 */
.media-plat{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;flex-shrink:0}
/* 自媒体 APP 风格图标（仿手机桌面） */
.media-app-icon{width:44px;height:44px;border-radius:22%;display:grid;place-items:center;font-size:22px;color:#fff;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.15);position:relative;overflow:hidden}
/* 抖音 - 黑底音符 */
.media-app-icon.douyin{background:#000}
/* 小红书 - 红色圆角方形 */
.media-app-icon.xhs{background:#ff2442;border-radius:28%}
/* 微博 - 白底眼睛图标 */
.media-app-icon.weibo{background:#fff;border:1px solid #eee;border-radius:22%}
/* 书籍封面 */
.book-cover{width:100%;aspect-ratio:3/4;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;color:#fff;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18);font-weight:700;overflow:hidden;position:relative}
.book-cover .bt{font-size:14px;line-height:1.3;margin-bottom:4px}
.book-cover .ba{font-size:11px;opacity:.85;font-weight:400}
.book-card{padding:10px;border-radius:14px;background:rgba(255,255,255,.45);transition:.25s;border:1px solid rgba(255,255,255,.5);display:flex;flex-direction:column;gap:8px;cursor:pointer}
.book-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);background:rgba(255,255,255,.7)}
.book-card .book-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-card .book-author{font-size:11px;color:var(--muted)}
/* 统计 */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{padding:16px;border-radius:16px;background:rgba(255,255,255,.5);text-align:center;border:1px solid rgba(255,255,255,.5)}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
/* 用药搜索结果 */
.drug-card{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.55);margin-bottom:9px;transition:.2s;border:1px solid rgba(255,255,255,.5);display:flex;align-items:center;gap:12px;cursor:pointer}
.drug-card:hover{background:#fff;transform:translateX(3px);box-shadow:var(--shadow-sm)}
/* 弹层 */
.modal-bg{position:fixed;inset:0;background:rgba(91,84,112,.35);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex;animation:fade .25s}
.modal{background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-radius:24px;padding:24px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h3{font-size:17px;margin-bottom:14px}
.modal .row{margin-bottom:12px}
.modal .acts{display:flex;gap:10px;margin-top:16px}
/* AI拆解 */
.ai-box{background:linear-gradient(135deg,rgba(244,166,189,.18),rgba(157,182,232,.18));border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:16px;margin-top:12px;font-size:13.5px;line-height:1.75}
.ai-box .ai-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;color:var(--accent)}
/* toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(91,84,112,.92);color:#fff;padding:11px 22px;border-radius:30px;font-size:13.5px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 安装指引 */
.guide-step{display:flex;gap:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.5);margin-bottom:10px;border:1px solid rgba(255,255,255,.5)}
.guide-step .n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
/* 同步状态 */
.sync-status{font-size:11px;color:var(--muted);text-align:center;padding:4px}
.sync-spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
/* 日历训练详情 */
.fit-detail{padding:14px;border-radius:14px;background:rgba(255,255,255,.5);margin-top:10px;border:1px solid rgba(255,255,255,.5)}
.fit-detail .fe{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.fit-detail .fe .tag{background:var(--sage)33;color:#5a8a4a}
/* 响应式 */
@media(max-width:980px){.cols-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){
  :root{--side-w:100%}
  .app{flex-direction:column}
  .main{order:1;flex:1;min-height:100vh;padding:14px 12px 90px}
  .side{order:2;width:100%;flex:0 0 auto;flex-direction:row;align-items:center;gap:0;padding:8px 6px 10px;height:auto;position:fixed;bottom:0;left:0;right:0;top:auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;z-index:100;backdrop-filter:blur(20px);background:rgba(255,255,255,.92);border-right:none;border-top:1px solid var(--rule);box-shadow:0 -2px 12px rgba(0,0,0,.06);-webkit-overflow-scrolling:touch;touch-action:pan-x}
  .side::-webkit-scrollbar{display:none}
  .brand{display:none}
  .nav{flex-direction:row;gap:4px;padding:0;width:max-content;overflow:visible}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{flex-direction:column;gap:4px;padding:6px 8px;min-width:62px;flex:0 0 62px;font-size:11px;border-radius:12px;justify-content:center}
  .nav-item .ic{width:42px;height:42px;border-radius:13px;font-size:22px;margin:0 auto}
  .nav-item .lbl{font-size:10px;line-height:1.1;text-align:center}
  .nav-item.active{background:rgba(255,255,255,.7)}
  .nav-item.active::before{left:50%;top:auto;transform:translateX(-50%);width:24px;height:3px;bottom:-5px}

  set(k,v){localStorage.setItem('wb_'+k,JSON.stringify(v));localStorage.setItem('wb_'+k+'_ts',Date.now().toString());},

/* 动态加载 Tesseract.js 本地 OCR 引擎 */
function loadTesseract(cb,onErr){
  if(window.Tesseract){cb(window.Tesseract);return;}
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload=function(){cb(window.Tesseract);};
  s.onerror=onErr||function(){};
  document.head.appendChild(s);
}
/* Canvas 图片预处理：灰度 + 对比度增强 + 二值化 + 放大，提升 OCR 精度 */
function preprocessImage(imgData,cb){
  var img=new Image();
  img.onload=function(){
    var scale=2;
    var c=document.createElement('canvas');
    c.width=img.width*scale;c.height=img.height*scale;
    var ctx=c.getContext('2d');
    ctx.drawImage(img,0,0,c.width,c.height);
    var imgData=ctx.getImageData(0,0,c.width,c.height);
    var d=imgData.data;
    /* 灰度 + 对比度增强 */
    var contrast=1.8,adjust=128*(1-contrast);
    for(var i=0;i<d.length;i+=4){
      var gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      gray=gray*contrast+adjust;
      /* 二值化 */
      gray=gray>140?255:0;
      d[i]=d[i+1]=d[i+2]=gray;
    }
    ctx.putImageData(imgData,0,0);
    cb(c.toDataURL('image/png'));
  };
  img.onerror=function(){cb(imgData);};
  img.src=imgData;
}
/* 本地解析排班 OCR 文本 */
function parseSchedText(text,name){
  var result={};
  var lines=text.split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l;});
  /* 策略1：表格模式 —— 找到日期表头行 + 姓名所在行 */
  if(name){
    var headerLine=-1,nameLine=-1;
    for(var i=0;i<lines.length;i++){
      if(lines[i].indexOf(name)>=0){nameLine=i;break;}
    }
    if(nameLine>=0){
      for(var j=nameLine;j>=0;j--){
        var nums=lines[j].match(/\b(\d{1,2})\b/g);
        if(nums&&nums.length>=5){headerLine=j;break;}
      }
      if(headerLine>=0){
        var days=lines[headerLine].match(/\b(\d{1,2})\b/g)||[];
        var nameParts=lines[nameLine].replace(name,'').split(/[\s\t,，;；|]+/).filter(function(x){return x;});
        var nameCells=[];
        nameParts.forEach(function(p){
          var m=p.match(/(白班|白|中班|中|夜班|夜|休息|休|备班|备)/);
          if(m)nameCells.push(normShift(m[1]));else nameCells.push(null);
        });
        days.forEach(function(d,idx){
          var day=parseInt(d);
          if(day>=1&&day<=31&&nameCells[idx])result[day]=nameCells[idx];
        });
        if(Object.keys(result).length>0)return result;
      }
    }
  }
  /* 策略2：逐行匹配 "日期 班次" 模式 */
  lines.forEach(function(line){
    var m=line.match(/(\d{1,2})\s*[日号]?\s*[:：\s]\s*(白班|白|中班|中|夜班|夜|休息|休|备班|备)/g);
    if(m){
      m.forEach(function(match){
        var p=match.match(/(\d{1,2})\s*[日号]?\s*[:：\s]\s*(白班|白|中班|中|夜班|夜|休息|休|备班|备)/);
        if(p){var day=parseInt(p[1]);if(day>=1&&day<=31)result[day]=normShift(p[2]);}
      });
    }
  });
  /* 策略3：整行连续班次，对应1~31号 */
  if(Object.keys(result).length===0&&lines.length>0){
    lines.forEach(function(line){
      if(line.indexOf(name||'')>=0||line.length>=10){
        var shifts=line.match(/(白班|白|中班|中|夜班|夜|休息|休|备班|备)/g);
        if(shifts&&shifts.length>=7){
          shifts.forEach(function(s,idx){var day=idx+1;if(day<=31)result[day]=normShift(s);});
        }
      }
    });
  }
  return result;
}

/* 导航到前一天/后一天 */
function navDay(delta){
  var y=window._sc.y,mo=window._sc.mo;
  var daysInMonth=new Date(y,mo+1,0).getDate();

/* 选择班次：直接写入主日历并刷新 */
function pickShift(shift){
  if(!_selectedDay)return;

  var ds=y+'-'+pad(mo+1)+'-'+pad(_selectedDay);
  var data=DB.get('schedule',{shifts:{}});

  var cal=calHtml(y,mo,function(d,cell){var s=data.shifts[d];if(s){var dot=document.createElement('div');dot.className='dot';dot.style.background=shiftColor(s);dot.textContent=s;cell.appendChild(dot);}});

/* 自动识别全图，找到姓名所在行，裁剪并逐格 OCR */
var _fullImg=new Image();
function autoDetectRow(imgData,name){
  var st=document.getElementById('ocrStatus');
  if(!name){if(st)st.innerHTML='<div class="sec-tip">请先在上方姓名框输入你的名字（如李慧慧），再上传照片</div>';return;}
  if(st)st.innerHTML='<div style="text-align:center;padding:10px"><span class="sync-spin"></span> <span style="font-size:13px;color:var(--muted)">正在加载OCR引擎…</span></div>';
  _fullImg=new Image();
  _fullImg.onload=function(){
    loadTesseract(function(Tesseract){
      if(st)st.innerHTML='<div style="text-align:center;padding:10px"><span class="sync-spin"></span> <span style="font-size:13px;color:var(--muted)">正在识别全图，寻找"'+name+'"的位置…</span></div>';
      preprocessImage(imgData,function(processedData){
        Tesseract.recognize(processedData,'chi_sim',{
          logger:function(m){
            if(st&&m.status){
              var pct=m.progress?Math.round(m.progress*100)+'%':'';
              st.innerHTML='<div style="text-align:center;padding:10px"><span class="sync-spin"></span> <span style="font-size:13px;color:var(--muted)">'+m.status+'…'+pct+'</span></div>';
            }
          }
        }).then(function(result){
          /* 在 words 和 lines 中搜索姓名 */
          var nameBbox=null;
          var words=result.data.words||[];
          var lines=result.data.lines||[];
          /* 先在 lines 里找 */
          for(var i=0;i<lines.length;i++){
            if(lines[i].text&&lines[i].text.indexOf(name)>=0){nameBbox=lines[i].bbox;break;}
          }
          /* 再在 words 里找 */
          if(!nameBbox){
            for(var i=0;i<words.length;i++){
              if(words[i].text&&words[i].text.indexOf(name)>=0){nameBbox=words[i].bbox;break;}
            }
          }
          /* 部分匹配：逐字搜索名字的每个字，找同一行y位置的 */
          if(!nameBbox&&name.length>1){
            var foundChars=[];
            for(var i=0;i<words.length;i++){
              for(var c=0;c<name.length;c++){
                if(words[i].text&&words[i].text.indexOf(name[c])>=0){foundChars.push(words[i]);break;}
              }
            }
            if(foundChars.length>=1){
              /* 按 y 分组，找包含最多名字字符的行 */
              var groups=[];
              foundChars.forEach(function(w){
                var wy=(w.bbox.y0+w.bbox.y1)/2;
                var placed=false;
                for(var g=0;g<groups.length;g++){
                  var gy=(groups[g][0].bbox.y0+groups[g][0].bbox.y1)/2;
                  if(Math.abs(wy-gy)<20){groups[g].push(w);placed=true;break;}
                }
                if(!placed)groups.push([w]);
              });
              groups.sort(function(a,b){return b.length-a.length;});
              if(groups[0]){
                var g=groups[0];
                nameBbox={
                  x0:Math.min.apply(null,g.map(function(w){return w.bbox.x0;})),
                  y0:Math.min.apply(null,g.map(function(w){return w.bbox.y0;})),
                  x1:Math.max.apply(null,g.map(function(w){return w.bbox.x1;})),
                  y1:Math.max.apply(null,g.map(function(w){return w.bbox.y1;}))
                };
              }
            }
          }
          if(nameBbox){
            if(st)st.innerHTML='<div class="sec-tip" style="border-color:var(--ok)">✅ 找到"'+name+'"，正在裁剪该行并逐格识别…</div>';
            doRowOCR(imgData,nameBbox,Tesseract,st);
          }else{
            /* 找不到名字，尝试找包含姓氏的行 */
            var surname=name.charAt(0);
            var surnamedBbox=null;
            for(var i=0;i<words.length;i++){
              if(words[i].text&&words[i].text.indexOf(surname)>=0){surnamedBbox=words[i].bbox;break;}
            }
            if(surnamedBbox){
              if(st)st.innerHTML='<div class="sec-tip">未精确找到"'+name+'"，但找到姓氏"'+surname+'"，尝试识别该行…</div>';
              doRowOCR(imgData,surnamedBbox,Tesseract,st);
            }else{
              if(st)st.innerHTML='<div class="sec-tip" style="border-color:var(--warn)">⚠️ 未找到"'+name+'"。请在上方照片上<strong>点一下你的排班行</strong>，系统会识别你点的那一行</div>';
              var hint=document.getElementById('photoHint');
              if(hint){hint.textContent='👆 点击你的排班行（点那一行任意位置）';hint.style.background='rgba(232,155,184,.85)';}
            }
          }
        }).catch(function(){
          if(st)st.innerHTML='<div class="sec-tip" style="border-color:var(--warn)">⚠️ 全图识别失败。请在上方照片上<strong>点一下你的排班行</strong>，系统会识别你点的那一行</div>';
          var hint=document.getElementById('photoHint');
          if(hint){hint.textContent='👆 点击你的排班行（点那一行任意位置）';hint.style.background='rgba(232,155,184,.85)';}
        });
      });
    },function(){
      if(st)st.innerHTML='<div class="sec-tip">OCR引擎加载失败，请检查网络后重试</div>';
    });
  };
  _fullImg.src=imgData;
}
/* 裁剪姓名所在行，整行 OCR */
function doRowOCR(imgData,nameBbox,Tesseract,st){
  var img=_fullImg;
  var imgW=img.width,imgH=img.height;
  var y=window._sc.y,mo=window._sc.mo;
  var daysInMonth=new Date(y,mo+1,0).getDate();
  /* 行的 y 范围 */
  var rowY0=Math.max(0,nameBbox.y0-3);
  var rowY1=Math.min(imgH,nameBbox.y1+3);
  var rowH=Math.max(1,rowY1-rowY0);
  /* 数据区域 x 范围 */
  var nameRowRatio=(nameBbox.x1-nameBbox.x0)/imgW;
  var dataX0=nameRowRatio<0.3?(nameBbox.x1+2):0;
  var dataX1=imgW;
  var dataW=Math.max(1,dataX1-dataX0);
  /* 裁剪整行并放大2倍 */
  var scale=2;
  var cc=document.createElement('canvas');
  cc.width=dataW*scale;
  cc.height=rowH*scale;
  var cctx=cc.getContext('2d');
  cctx.imageSmoothingEnabled=true;
  cctx.drawImage(img,dataX0,rowY0,dataW,rowH,0,0,cc.width,cc.height);
  /* 灰度+对比度增强 */
  var id=cctx.getImageData(0,0,cc.width,cc.height);
  var dd=id.data;
  var contrast=1.5,adj=128*(1-contrast);
  for(var i=0;i<dd.length;i+=4){
    var g=0.299*dd[i]+0.587*dd[i+1]+0.114*dd[i+2];
    g=g*contrast+adj;
    dd[i]=dd[i+1]=dd[i+2]=g;
  }
  cctx.putImageData(id,0,0);
  var rowImgUrl=cc.toDataURL('image/png');
  /* 显示裁剪后的排班行 */
  var parsedBox=document.getElementById('ocrParsed');
  if(parsedBox){
    parsedBox.innerHTML='<div style="margin-bottom:8px"><label class="fl">裁剪的排班行</label>'+
      '<div style="border-radius:10px;overflow:hidden;border:2px solid var(--accent);margin-top:4px;background:#fff">'+
      '<img src="'+rowImgUrl+'" style="width:100%;display:block"></div></div>';
  }
  /* 整行 OCR */
  if(st)st.innerHTML='<div style="text-align:center;padding:10px"><span class="sync-spin"></span> <span style="font-size:13px;color:var(--muted)">正在识别整行排班…</span></div>';
  Tesseract.recognize(rowImgUrl,'chi_sim',{
    logger:function(m){
      if(st&&m.status){
        var pct=m.progress?Math.round(m.progress*100)+'%':'';
        st.innerHTML='<div style="text-align:center;padding:10px"><span class="sync-spin"></span> <span style="font-size:13px;color:var(--muted)">'+m.status+'…'+pct+'</span></div>';
      }
    }
  }).then(function(result){
    var fullText=(result.data.text||'').replace(/\s+/g,'').trim();
    /* 获取每个 word 的 bbox */
    var words=result.data.words||[];
    /* 按日期数量等分宽度，根据 word 的 x 坐标分配到对应日期 */
    var cellW=cc.width/daysInMonth;
    var results={};
    if(words.length>1){
      /* 用 words 的 bbox 分配到日期格 */
      words.forEach(function(w){
        if(!w.text||!w.bbox)return;
        var txt=w.text.replace(/\s+/g,'').trim();
        if(!txt)return;
        var centerX=(w.bbox.x0+w.bbox.x1)/2;
        var day=Math.floor(centerX/cellW)+1;
        if(day<1)day=1;
        if(day>daysInMonth)day=daysInMonth;
        /* 只保留班次相关字符 */
        var cleaned=txt.replace(/[^\u4e00-\u9fff a-zA-Z0-9]/g,'').trim();
        if(cleaned&&cleaned.length<=4){
          if(!results[day])results[day]=cleaned;
        }
      });
    }
    /* 如果 word 分配失败，尝试按字符分割 */
    if(Object.keys(results).length===0&&fullText.length>0){
      var chars=fullText.split('');
      var charsPerCell=Math.max(1,Math.floor(chars.length/daysInMonth));
      for(var i=0;i<chars.length&&i<daysInMonth*3;i++){
        var dayIdx=Math.floor(i/charsPerCell)+1;
        if(dayIdx>daysInMonth)dayIdx=daysInMonth;
        var ch=chars[i];
        if(/[\u4e00-\u9fff]/.test(ch)){
          if(!results[dayIdx])results[dayIdx]=ch;
        }
      }
    }
    /* 填入网格 */
    var count=0;
    Object.keys(results).forEach(function(day){
      var s=results[day];
      if(s){_quickShifts[parseInt(day)]=s;count++;}
    });
    updateQuickGrid();
    if(count>0){
      if(st)st.innerHTML='<div class="sec-tip" style="border-color:var(--ok)">✅ 识别完成，识别到 '+count+' 条排班。原始文字：「'+fullText+'」请核对后确认</div>';
    }else{
      if(st)st.innerHTML='<div class="sec-tip" style="border-color:var(--warn)">⚠️ 识别到0条。原始文字：「'+fullText+'」可能图片不够清晰，建议手动点击日期设置班次</div>';
    }
  }).catch(function(){
    if(st)st.innerHTML='<div class="sec-tip" style="border-color:var(--warn)">⚠️ 识别失败，请手动点击日期设置班次</div>';
  });
}
/* 直接返回 OCR 识别的原始文字，不做任何映射转换 */

/* 确认快速录入排班并同步到日历 */
function confirmQuickSched(){
  var keys=Object.keys(_quickShifts);
  if(!keys.length){toast('请先在网格中点击设置排班');return;}
  var data=DB.get('schedule',{shifts:{}});
  var y=window._sc.y,mo=window._sc.mo;
  var count=0;
  keys.forEach(function(day){
    var d=parseInt(day);
    var ds=y+'-'+pad(mo+1)+'-'+pad(d);
    if(_quickShifts[d]){data.shifts[ds]=_quickShifts[d];count++;}
  });
  DB.set('schedule',data);
  var box=document.getElementById('ocrResult');
  if(box)box.innerHTML='<div class="sec-tip" style="border-color:var(--ok)">✅ 已同步 '+count+' 条排班到日历</div>';
  render_schedule();
  toast('排班已同步');
}
function addSchedManual(){
  var d=document.getElementById('schedDate').value,s=document.getElementById('schedShift').value;
  if(!d){toast('请选择日期');return;}
  var data=DB.get('schedule',{shifts:{}});data.shifts[d]=s;DB.set('schedule',data);
  toast('已添加排班');render_schedule();
}
function render_schedule_cal(delta){
  window._sc.mo+=delta;
  if(window._sc.mo>11){window._sc.mo=0;window._sc.y++;}
  if(window._sc.mo<0){window._sc.mo=11;window._sc.y--;}
  var data=DB.get('schedule',{shifts:{}});
  var cal=calHtml(window._sc.y,window._sc.mo,function(ds,cell){var s=data.shifts[ds];if(s){var dot=document.createElement('div');dot.className='dot';dot.style.background=shiftColor(s);dot.textContent=s;cell.appendChild(dot);}});
  var box=document.getElementById('schedCal');if(box)box.innerHTML=cal;
}
function clearSched(){if(confirm('确认清空所有排班数据？')){DB.set('schedule',{shifts:{}});render_schedule();toast('已清空排班');}}

/* 根据训练名称判断类型（用于颜色分类） */
function fitGetType(name){
  if(!name)return 'other';
  var n=name.replace(/\s+/g,'');
  if(/休息|休|rest/i.test(n))return 'rest';
  if(/爵士舞|舞蹈|跳舞|舞/i.test(n))return 'dance';
  if(/广场舞|广场/i.test(n))return 'sq';
  if(/普拉提|pilates/i.test(n))return 'pilates';
  if(/核心|平板|卷腹|腹肌|腰腹|腹部|腹/i.test(n))return 'core';
  if(/手臂|肩背|背部|肩部|臀部|臀腿|腿部|腿|肩|力量|哑铃|杠铃|器械|力量训练/i.test(n))return 'strength';
  if(/有氧|跑步|跳绳|椭圆机|单车|自行车|hiit|tabata|燃脂|搏击操|搏击/i.test(n))return 'cardio';
  if(/瑜伽|拉伸|放松/i.test(n))return 'other';
  return 'other';
}
/* 格式化时长：秒 -> 时:分:秒 或 分:秒 */
function fitFmtDur(sec){
  if(!sec)return '';
  sec=Math.round(sec);
  var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return h+':'+pad(m)+':'+pad(s);
  return m+':'+pad(s);
}
/* 解析时长字符串（如 "1:20:14"、"56:10"）为秒数 */
function fitParseDur(str){
  if(!str)return 0;
  var parts=str.trim().split(':').map(Number);
  if(parts.some(isNaN))return 0;
  if(parts.length===3)return parts[0]*3600+parts[1]*60+parts[2];
  if(parts.length===2)return parts[0]*60+parts[1];
  if(parts.length===1)return parts[0];
  return 0;
}
/* 数据迁移：旧格式转为新格式（数组多条记录） */
function fitMigrate(data){
  if(!data||!data.records)return {records:{},manual:{}};
  var newData={records:{},manual:{}};
  ['records','manual'].forEach(function(src){
    Object.keys(data[src]||{}).forEach(function(ds){
      var item=data[src][ds];
      if(Array.isArray(item)){newData[src][ds]=item;return;}
      /* 旧格式：{title,items:[{name,type}],note} */
      var recs=[];
      if(item.items&&item.items.length){
        item.items.forEach(function(it){
          recs.push({name:it.name,duration:0,type:fitGetType(it.name)});
        });
      }else if(item.title){
        recs.push({name:item.title,duration:0,type:fitGetType(item.title)});
      }
      if(recs.length)newData[src][ds]=recs;
    });
  });
  return newData;
}
/* 获取某天的训练记录（合并records和manual） */
function fitGetDayRecs(data,ds){
  var r=data.records[ds]||[];
  var m=data.manual[ds]||[];
  return r.concat(m);
}
/* 在日历单元格渲染训记风格的训练记录 */
function fitRenderCell(ds,cell,data){
  var recs=fitGetDayRecs(data,ds);
  cell.style.cursor='pointer';
  if(!recs||!recs.length)return;
  /* 计算总时长 */
  var totalSec=recs.reduce(function(s,r){return s+(r.duration||0);},0);
  if(totalSec>0){
    var total=document.createElement('div');
    total.className='fit-rec-total';
    total.textContent=fitFmtDur(totalSec);
    cell.appendChild(total);
  }
  /* 最多显示4条，超出显示+N */
  var maxShow=4;
  recs.slice(0,maxShow).forEach(function(r){
    var rec=document.createElement('div');
    rec.className='fit-rec '+(r.type||fitGetType(r.name));
    if(r.duration){
      var dur=document.createElement('div');
      dur.className='dur';
      dur.textContent=fitFmtDur(r.duration);
      rec.appendChild(dur);
    }
    var nm=document.createElement('div');
    nm.className='name';
    nm.textContent=r.name||'训练';
    rec.appendChild(nm);
    cell.appendChild(rec);
  });
  if(recs.length>maxShow){
    var more=document.createElement('div');
    more.style.fontSize='8.5px';more.style.color='var(--muted)';more.style.textAlign='center';
    more.textContent='+'+(recs.length-maxShow);
    cell.appendChild(more);
  }
}

/* 训记截图OCR导入 */
function fitOcrImport(e){
  var file=e.target.files&&e.target.files[0];
  if(!file)return;
  e.target.value='';
  toast('正在加载OCR引擎…');
  loadTesseract(function(Tesseract){
    toast('正在识别截图，请稍候…');
    var reader=new FileReader();
    reader.onload=function(ev){
      Tesseract.recognize(ev.target.result,'chi_sim+eng',{
        logger:function(m){}
      }).then(function(result){
        var text=result.data.text;
        var parsed=fitParseOcrText(text);
        if(parsed.count>0){
          fitShowOcrPreview(parsed);
        }else{
          toast('未识别到训练数据，请确保截图清晰包含训记日历');
        }
      }).catch(function(){
        toast('识别失败，请重试');
      });
    };
    reader.readAsDataURL(file);
  },function(){toast('OCR引擎加载失败');});
}
/* 解析OCR文本，提取日期+训练记录 */
function fitParseOcrText(text){
  var lines=text.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var records={};
  var year=window._fc.y,month=window._fc.mo+1;
  /* 尝试从文本中提取年月 */
  var ymMatch=text.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/);
  if(ymMatch){year=parseInt(ymMatch[1]);month=parseInt(ymMatch[2]);}
  /* 训记日历格式：日期下面有时长和训练名，尝试匹配 */
  /* 常见模式：时长（如 1:20:14, 56:10）+ 训练名（如 手臂、爵士舞） */
  var durPattern=/(\d{1,2}:\d{2}(?::\d{2})?)/g;
  /* 遍历所有行，找日期和紧随其后的训练记录 */
  var currentDay=null;
  var buffer=[];
  lines.forEach(function(line){
    /* 检测日期行（纯数字1-31） */
    if(/^\d{1,2}$/.test(line)){
      var d=parseInt(line);
      if(d>=1&&d<=31){
        /* 保存上一天的记录 */
        if(currentDay&&buffer.length){
          var ds=year+'-'+pad(month)+'-'+pad(currentDay);
          records[ds]=buffer;
        }
        currentDay=d;
        buffer=[];
        return;
      }
    }
    if(currentDay){
      /* 检测时长行 或 训练名称行 */
      var durMatch=line.match(durPattern);
      if(durMatch){
        /* 这行包含时长，训练名可能在下一行或同一行 */
        var dur=fitParseDur(durMatch[0]);
        var name=line.replace(durPattern,'').trim();
        if(name&&name.length<12){
          buffer.push({name:name,duration:dur,type:fitGetType(name)});
        }else{
          /* 暂存时长，等下一行的名称 */
          buffer._pendingDur=dur;
        }
        return;
      }
      /* 短文本（<10字）可能是训练名 */
      if(line.length>0&&line.length<12&&/[\u4e00-\u9fa5a-zA-Z]/.test(line)){
        if(buffer._pendingDur){
          buffer.push({name:line,duration:buffer._pendingDur,type:fitGetType(line)});
          delete buffer._pendingDur;
        }else if(!/休息|报表|设置|历史|训练|动作|挑战|我的|月|年/.test(line)){
          buffer.push({name:line,duration:0,type:fitGetType(line)});
        }
      }
    }
  });
  /* 保存最后一天 */
  if(currentDay&&buffer.length){
    var ds=year+'-'+pad(month)+'-'+pad(currentDay);
    records[ds]=buffer;
  }
  var count=Object.values(records).reduce(function(s,a){return s+a.length;},0);
  return {records:records,count:count,year:year,month:month};
}
/* 显示OCR识别预览，确认后导入 */
function fitShowOcrPreview(parsed){
  var html='<h3>📷 训记截图识别结果</h3>'+
    '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">识别到 '+parsed.count+' 条训练记录（'+parsed.year+'年'+parsed.month+'月），请确认后导入：</div>'+
    '<div style="max-height:300px;overflow-y:auto;margin-bottom:12px">';
  Object.keys(parsed.records).sort().forEach(function(ds){
    html+='<div style="font-weight:700;font-size:13px;margin-top:8px">'+ds+'</div>';
    parsed.records[ds].forEach(function(r){
      html+='<div class="fit-rec '+r.type+'" style="max-width:150px;margin:4px 0">'+
        (r.duration?'<div class="dur">'+fitFmtDur(r.duration)+'</div>':'')+
        '<div class="name">'+r.name+'</div></div>';
    });
  });
  html+='</div>'+
    '<div class="acts"><button class="btn primary btn-block" onclick="fitImportOcrData()">✅ 确认导入</button></div>'+
    '<div class="acts"><button class="btn btn-block" onclick="closeModal()">取消</button></div>';
  window._ocrParsed=parsed;
  var m=document.getElementById('modal');
  m.innerHTML=html;
  document.getElementById('modalBg').classList.add('show');
}
function fitImportOcrData(){
  if(!window._ocrParsed){toast('无数据可导入');return;}
  var parsed=window._ocrParsed;
  var data=fitMigrate(DB.get('fitness',{records:{},manual:{}}));
  var added=0;
  Object.keys(parsed.records).forEach(function(ds){
    if(!data.manual[ds])data.manual[ds]=[];
    parsed.records[ds].forEach(function(r){
      data.manual[ds].push(r);
      added++;
    });
  });
  DB.set('fitness',data);
  window._ocrParsed=null;
  closeModal();
  toast('✅ 已导入 '+added+' 条训练记录');
  render_fitness();
}

    '<div class="stat-row" style="margin-top:10px;margin-bottom:10px"><div class="stat"><div class="v" style="color:var(--ok);font-size:16px">+'+fIn.toFixed(2)+'</div><div class="l">收入</div></div><div class="stat"><div class="v" style="color:var(--danger);font-size:16px">-'+fOut.toFixed(2)+'</div><div class="l">支出</div></div><div class="stat"><div class="v" style="color:var(--accent);font-size:16px">'+(fIn-fOut>=0?'+':'')+(fIn-fOut).toFixed(2)+'</div><div class="l">结余</div></div></div>'+
    '<div id="accList" style="max-height:360px;overflow-y:auto">'+(dayHtml||'<div style="text-align:center;color:var(--muted);padding:30px">暂无记录</div>')+'</div></div>'+
    '</div>';
  window._accTab='out';setAccTab('out');
}
function setAccTab(t){
  window._accTab=t;

function setAccFilter(type){
  window._accFilterType=type;

function applyAccFilter(val){

}
function addAcc(){

function searchMed(q){
  q=(q||'').trim().toLowerCase();
  var box=document.getElementById('medList');if(!box)return;

    API.searchDrug(q).then(function(res){
      if(res.list&&res.list.length){
        box.innerHTML=res.list.map(function(d){return renderDrugCard(d);}).join('');
      }else{box.innerHTML=localDrugHtml(list,q);}
    }).catch(function(){box.innerHTML=localDrugHtml(list,q);});

  if(!list.length)return '<div style="text-align:center;color:var(--muted);padding:24px">未找到相关药品，试试其他关键词～</div>';

}
function renderDrugCard(d){

}

   §16 生理期模块（保持不变）
   ================================================================ */
function render_period(){
  var v=$('.view[data-id=period]');
  var data=DB.get('period',{periods:[]});
  if(!window._pc)window._pc={y:new Date().getFullYear(),mo:new Date().getMonth()};
  var cal=calHtml(window._pc.y,window._pc.mo,function(ds,cell){
    var inPeriod=data.periods.some(function(p){return ds>=p.start&&(!p.end||ds<=p.end);});
    if(inPeriod){cell.style.background='rgba(238,155,179,.25)';var dot=document.createElement('div');dot.className='dot';dot.style.background='var(--rose)';dot.textContent='🌸';cell.appendChild(dot);}
  });
  var sorted=data.periods.slice().sort(function(a,b){return a.start<b.start?-1:1;});
  var statsHtml='',avgLen=0,avgCycle=0;
  if(sorted.length){
    var lens=[],cycles=[];
    sorted.forEach(function(p){if(p.end){lens.push((parseDate(p.end)-parseDate(p.start))/86400000+1);}});
    for(var i=1;i<sorted.length;i++)cycles.push((parseDate(sorted[i].start)-parseDate(sorted[i-1].start))/86400000);
    avgLen=lens.length?Math.round(lens.reduce(function(a,b){return a+b;},0)/lens.length):0;
    avgCycle=cycles.length?Math.round(cycles.reduce(function(a,b){return a+b;},0)/cycles.length):0;
    var nextPred='—';
    if(avgCycle&&sorted.length){var last=parseDate(sorted[sorted.length-1].start);nextPred=fmtDate(new Date(last.getTime()+avgCycle*86400000));}
    statsHtml='<div class="stat-row"><div class="stat"><div class="v" style="color:var(--rose)">'+avgCycle+'</div><div class="l">平均周期(天)</div></div><div class="stat"><div class="v" style="color:var(--rose)">'+avgLen+'</div><div class="l">平均经期(天)</div></div><div class="stat"><div class="v" style="color:var(--accent);font-size:16px">'+nextPred+'</div><div class="l">下次预测</div></div></div>';
  }else{statsHtml='<div class="sec-tip">还没有记录，先在日历上标记开始/结束日期吧～</div>';}
  v.innerHTML='<div class="grid cols-2">'+
    '<div class="card glass"><div class="card-h"><span class="ic" style="background:var(--rose)">🌸</span><h3>生理期日历</h3></div><div id="periodCal">'+cal+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn primary sm" onclick="markPeriod(\'start\')">标记开始日</button><button class="btn sm" onclick="markPeriod(\'end\')">标记结束日</button><button class="btn ghost sm danger" onclick="clearPeriod()">清空</button></div>'+
    '<p style="font-size:12px;color:var(--muted);margin-top:8px">点击日历选中日期后再点上方按钮标记。</p></div>'+
    '<div class="card glass"><div class="card-h"><span class="ic" style="background:var(--lav)">📊</span><h3>周期统计</h3></div>'+statsHtml+
    '<div style="margin-top:10px"><b style="font-size:14px">历史记录</b>'+
    (sorted.length?sorted.slice().reverse().map(function(p){return '<div class="li"><span style="font-size:18px">🌸</span><div class="meta"><b>'+p.start+' → '+(p.end||'进行中')+'</b><small>'+(p.end?'经期 '+((parseDate(p.end)-parseDate(p.start))/86400000+1)+' 天':'点击结束日补全')+'</small></div><button class="btn ghost sm danger" onclick="delPeriod(\''+p.id+'\')">✕</button></div>';}).join(''):'<div style="text-align:center;color:var(--muted);padding:16px">暂无记录</div>')+
    '</div></div></div>';
  window._periodSel=null;bindPeriodCellClick();
}
function render_period_cal(delta){
  window._pc.mo+=delta;
  if(window._pc.mo>11){window._pc.mo=0;window._pc.y++;}
  if(window._pc.mo<0){window._pc.mo=11;window._pc.y--;}
  var data=DB.get('period',{periods:[]});
  var cal=calHtml(window._pc.y,window._pc.mo,function(ds,cell){
    var inPeriod=data.periods.some(function(p){return ds>=p.start&&(!p.end||ds<=p.end);});
    if(inPeriod){cell.style.background='rgba(238,155,179,.25)';var dot=document.createElement('div');dot.className='dot';dot.style.background='var(--rose)';dot.textContent='🌸';cell.appendChild(dot);}
    if(ds===window._periodSel)cell.style.outline='2px solid var(--accent)';
  });
  var box=document.getElementById('periodCal');if(box)box.innerHTML=cal;bindPeriodCellClick();
}
function bindPeriodCellClick(){
  document.querySelectorAll('#periodCal .cal-cell[data-date]').forEach(function(c){
    c.onclick=function(){window._periodSel=c.dataset.date;render_period_cal(0);};
  });
}
function markPeriod(type){
  if(!window._periodSel){toast('请先点击日历选择日期');return;}
  var data=DB.get('period',{periods:[]});
  if(type==='start'){data.periods.push({id:uid(),start:window._periodSel,end:''});}
  else{var p=data.periods.find(function(x){return !x.end;});if(p){if(window._periodSel<p.start){toast('结束日不能早于开始日');return;}p.end=window._periodSel;}else{toast('请先标记开始日');return;}}
  DB.set('period',data);render_period();
}
function delPeriod(id){var d=DB.get('period',{periods:[]});d.periods=d.periods.filter(function(p){return p.id!==id;});DB.set('period',d);render_period();}
function clearPeriod(){if(confirm('清空所有生理期记录？')){DB.set('period',{periods:[]});render_period();}}

function render_memo(){
  var v=$('.view[data-id=memo]');
  var data=DB.get('memo',{todos:[]});
  var sorted=data.todos.slice().sort(function(a,b){return (a.done-b.done)||(b.createdAt-a.createdAt);});
  var done=data.todos.filter(function(t){return t.done;}).length;
  v.innerHTML='<div class="card glass"><div class="card-h"><span class="ic" style="background:var(--lemon)">📝</span><h3>待办事项</h3><span class="more">'+done+'/'+data.todos.length+' 完成</span></div>'+
    '<div style="display:flex;gap:8px;margin-bottom:16px"><input id="memoInput" class="field" placeholder="添加待办…" onkeydown="if(event.key===\'Enter\')addMemo()" style="flex:1"><button class="btn primary" onclick="addMemo()">＋</button></div>'+
    (sorted.length?sorted.map(function(t){return '<div class="li"><div class="check'+(t.done?' done':'')+'" onclick="toggleMemo(\''+t.id+'\')"></div><div class="meta"><b style="'+(t.done?'text-decoration:line-through;color:var(--muted)':'')+'">'+t.text+'</b><small>'+t.createdAt+'</small></div><button class="btn ghost sm danger" onclick="delMemo(\''+t.id+'\')">✕</button></div>';}).join(''):'<div style="text-align:center;color:var(--muted);padding:40px">还没有待办，添加第一个吧～</div>')+
    '</div>';
}
function addMemo(){var inp=document.getElementById('memoInput');var val=inp.value.trim();if(!val)return;var d=DB.get('memo',{todos:[]});d.todos.push({id:uid(),text:val,done:false,createdAt:fmtDate(new Date())});DB.set('memo',d);inp.value='';render_memo();}
function toggleMemo(id){var d=DB.get('memo',{todos:[]});var t=d.todos.find(function(x){return x.id===id;});if(t){t.done=!t.done;DB.set('memo',d);render_memo();}}
function delMemo(id){var d=DB.get('memo',{todos:[]});d.todos=d.todos.filter(function(t){return t.id!==id;});DB.set('memo',d);render_memo();}
